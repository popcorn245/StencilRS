<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stencilrs starter</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #222;
      }
      p.hint {
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>stencilrs starter</h1>
    <p class="hint">
      Components in <code>src/components/</code>, compiled by stencilrs. Edit one and the page
      updates in place.
    </p>

    <h2>Counter</h2>
    <pop-counter label="Clicks" step="1"></pop-counter>

    <h2>Greeting</h2>
    <pop-greeting name="Stencil"></pop-greeting>
    <p id="log"></p>

    <h2>pop-toggle</h2>
    <pop-toggle></pop-toggle>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
