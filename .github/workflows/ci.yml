name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # scripts/ci.sh only installs Rust when cargo is missing.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # Chromium only, at the Playwright version the ui-kit pins, so the server-render smoke test's
      # browser step (examples/ui-kit/ssr) runs here; it finds the download through Playwright's
      # own executablePath(). Without a browser that step skips itself.
      - name: Install Chromium for the browser checks
        run: npx -y playwright@1.64.1 install --with-deps chromium

      - name: Build and test
        run: bash scripts/ci.sh

      # On main, rebuild the Storybook for the /StencilRS/ base path and publish that copy.
      # (scripts/ci.sh's own build, for the Forgejo mirror, stays at the root path.)
      - name: Build Storybook for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: STORYBOOK_BASE_PATH=/StencilRS/ npm --prefix storybook run build -- -o dist-pages

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: storybook/dist-pages

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
