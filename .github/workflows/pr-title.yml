name: pr-title

# Pull requests are squash-merged, so the title becomes the commit semantic-release reads:
# it has to be a conventional commit (feat:, fix:, docs:, chore:, ...).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
