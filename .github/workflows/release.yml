name: release

# Builds the native binary for every platform, installs each one from packed tarballs on its own
# OS (no Rust involved) and publishes the platform packages and the root package to npm.
#
# A release is a version on main with no tag yet: merge a package.json version bump and this
# publishes it, then tags it and creates the GitHub Release. (Pushing a v* tag by hand works too.)
# Pull requests that touch the binding run everything but the publish.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'package*.json'
      - 'index.js'
      - 'npm/**'
      - 'scripts/release.mjs'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Is there something to release? On main: the package.json version, unless it's already tagged.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          version=$(node -p "require('./package.json').version")
          release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release=true
          elif [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null || release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "v$version: release=$release"

  build:
    name: build ${{ matrix.target }}
    needs: version
    if: github.event_name == 'pull_request' || needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # napi's cross toolchain links Linux against glibc 2.17, so old distros load it too.
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, flags: --use-napi-cross }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-gnu, flags: --use-napi-cross }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - run: npm ci --ignore-scripts

      - name: Build
        shell: bash
        run: npm run build:native -- --target ${{ matrix.target }} ${{ matrix.flags }}

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: stencilrs.*.node
          if-no-files-found: error

  # Install the packed packages into an empty project, the way a user would, and load the binary.
  test:
    name: install on ${{ matrix.platform }}${{ matrix.container && format(' ({0})', matrix.container) || '' }}
    needs: build
    runs-on: ${{ matrix.host }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x64-gnu }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x64-gnu, container: 'node:22-bullseye' }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64-gnu }
          - { host: macos-15-intel, target: x86_64-apple-darwin, platform: darwin-x64 }
          - { host: macos-latest, target: aarch64-apple-darwin, platform: darwin-arm64 }
          - { host: windows-latest, target: x86_64-pc-windows-msvc, platform: win32-x64-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: ${{ !matrix.container }}
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: npm/${{ matrix.platform }}

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pkgs" "$RUNNER_TEMP/app"
          npm pack ./npm/${{ matrix.platform }} --pack-destination "$RUNNER_TEMP/pkgs"
          npm pack --pack-destination "$RUNNER_TEMP/pkgs"

      - name: Install and load
        working-directory: ${{ runner.temp }}/app
        run: |
          npm init -y >/dev/null
          npm install --legacy-peer-deps --no-audit --no-fund "$RUNNER_TEMP"/pkgs/*.tgz
          node --input-type=module -e "
            import { analyze } from '@popcorn245/stencilrs';
            const { components } = analyze(
              \"import { Component } from '@stencil/core'; @Component({ tag: 'cmp-a' }) export class A {}\",
              'a.tsx',
            );
            if (components[0]?.tagName !== 'cmp-a') throw new Error(JSON.stringify(components));
            console.log('loaded on', process.platform, process.arch);
          "

  publish:
    if: needs.version.outputs.release == 'true'
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub Release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: artifacts
          merge-multiple: true

      - run: npm ci --ignore-scripts

      - name: Put each binary in its package
        run: npx napi artifacts --output-dir artifacts --npm-dir npm

      - name: Versions and optionalDependencies
        run: node scripts/release.mjs

      # Skips what is already on npm, so a run that failed halfway can simply be re-run.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish() {
            spec=$(node -p "const p = require('./$1/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version >/dev/null 2>&1; then echo "$spec already published"; return; fi
            npm publish "./$1" --provenance --access public
          }
          for dir in npm/*/; do publish "${dir%/}"; done
          publish .

      # Last, so a failed publish leaves no tag behind: re-run the workflow (or dispatch it on main).
      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already released"; exit 0; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
