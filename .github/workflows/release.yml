name: release

# Builds the native binary for every platform, installs each one from packed tarballs on its own
# OS (no Rust involved) and publishes the platform packages and the root package to npm.
#
# Releases are semantic-release on main: the conventional commits merged since the last tag pick
# the version (fix: patch, feat: minor, BREAKING CHANGE: major); no release-worthy commit, no
# release. It publishes, then tags and writes the GitHub Release. Pull requests that touch the
# binding run the build and install checks only.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'package*.json'
      - 'index.js'
      - 'npm/**'
      - 'scripts/release.mjs'
      - 'scripts/publish.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What would semantic-release publish? A dry run on main; nothing on pull requests.
  version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release checks it could push the tag, even in a dry run
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      # Before the first release: a local v0.0.0 on the first commit, so the first version is
      # 0.1.0 rather than semantic-release's default 1.0.0. Never pushed.
      - name: Base tag
        run: git tag --list 'v*' | grep -q . || git tag v0.0.0 "$(git rev-list --max-parents=0 HEAD)"

      - id: next
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx semantic-release --dry-run
          echo "version=$(cat .release-version 2>/dev/null)" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: version
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.version.outputs.version) }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # napi's cross toolchain links Linux against glibc 2.17, so old distros load it too.
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, flags: --use-napi-cross }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-gnu, flags: --use-napi-cross }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - run: npm ci --ignore-scripts

      - name: Build
        shell: bash
        run: npm run build:native -- --target ${{ matrix.target }} ${{ matrix.flags }}

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: stencilrs.*.node
          if-no-files-found: error

  # Install the packed packages into an empty project, the way a user would, and load the binary.
  test:
    name: install on ${{ matrix.platform }}${{ matrix.container && format(' ({0})', matrix.container) || '' }}
    needs: build
    runs-on: ${{ matrix.host }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x64-gnu }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x64-gnu, container: 'node:22-bullseye' }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64-gnu }
          - { host: macos-15-intel, target: x86_64-apple-darwin, platform: darwin-x64 }
          - { host: macos-latest, target: aarch64-apple-darwin, platform: darwin-arm64 }
          - { host: windows-latest, target: x86_64-pc-windows-msvc, platform: win32-x64-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: ${{ !matrix.container }}
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: npm/${{ matrix.platform }}

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pkgs" "$RUNNER_TEMP/app"
          npm pack ./npm/${{ matrix.platform }} --pack-destination "$RUNNER_TEMP/pkgs"
          npm pack --pack-destination "$RUNNER_TEMP/pkgs"

      - name: Install and load
        working-directory: ${{ runner.temp }}/app
        run: |
          npm init -y >/dev/null
          npm install --legacy-peer-deps --no-audit --no-fund "$RUNNER_TEMP"/pkgs/*.tgz
          node --input-type=module -e "
            import { analyze } from '@popcorn245/stencilrs';
            const { components } = analyze(
              \"import { Component } from '@stencil/core'; @Component({ tag: 'cmp-a' }) export class A {}\",
              'a.tsx',
            );
            if (components[0]?.tagName !== 'cmp-a') throw new Error(JSON.stringify(components));
            console.log('loaded on', process.platform, process.arch);
          "

  publish:
    if: ${{ !cancelled() && needs.version.outputs.version && needs.test.result == 'success' }}
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub Release
      issues: write # semantic-release opens an issue when a release fails
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: artifacts
          merge-multiple: true

      - run: npm ci --ignore-scripts

      - name: Put each binary in its package
        run: npx napi artifacts --output-dir artifacts --npm-dir npm

      - name: Base tag
        run: git tag --list 'v*' | grep -q . || git tag v0.0.0 "$(git rev-list --max-parents=0 HEAD)"

      # Versions every package (scripts/release.mjs), publishes them (scripts/publish.sh), then
      # tags and writes the GitHub Release. A run that fails can be re-run: published versions
      # are skipped.
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
