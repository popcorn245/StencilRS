[package]
name = "stencilrs_napi"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.14.2"
napi-derive = "3.6.12"
serde = "1.0.229"
serde_json = "1.0.154"
stencilrs_transform = { version = "0.1.0", path = "../stencilrs_transform" }

# mimalloc as the global allocator, as oxc and Rolldown do. `mimalloc-safe` is the napi-rs fork
# made for cdylibs; on Linux it needs local-dynamic TLS, or dlopen of the addon can fail with
# "cannot allocate memory in static TLS block".
[target.'cfg(not(target_os = "linux"))'.dependencies]
mimalloc-safe = { version = "0.1.67", features = ["skip_collect_on_exit"] }

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc-safe = { version = "0.1.67", features = ["skip_collect_on_exit", "local_dynamic_tls"] }

# mimalloc builds arm64 with `-march=armv8.1-a`, which the older gcc in napi-rs's cross toolchain
# rejects.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
mimalloc-safe = { version = "0.1.67", features = ["no_opt_arch"] }

[build-dependencies]
napi-build = "2.6.0"
