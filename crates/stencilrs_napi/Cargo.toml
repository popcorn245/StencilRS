[package]
name = "stencilrs_napi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14.2", features = ["serde-json"] }
napi-derive = "3.6.12"
serde = "1.0.229"
serde_json = "1.0.154"
stencilrs_transform = { version = "0.1.0", path = "../stencilrs_transform" }

[build-dependencies]
napi-build = "2.6.0"
