[package]
name = "stencilrs_transform"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
fancy-regex = "0.19"
memchr = "2.8.3"
oxc = { version = "0.154.0", features = ["ast_visit", "semantic", "codegen", "transformer"] }
oxc_sourcemap = "9.0.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
